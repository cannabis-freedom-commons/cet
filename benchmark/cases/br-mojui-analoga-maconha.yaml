id: br-mojui-analoga-maconha
title: "Arrest in Mojuí dos Campos with a substance \"analogous to marijuana\""
family: new-event
tests: [scope, languages, terminology]
submit: https://oimpacto.com.br/2026/11/suspeito-e-preso-em-mojui-dos-campos-apos-ser-flagrado-com-maconha-e-cocaina/
why: >-
  Brazilian police reports say "substância análoga à maconha" for suspected marijuana that has not
  yet been lab-tested. It is not a synthetic cannabinoid. A model in production rejected this page
  as synthetic; the right answer is a small new report: one man arrested, twelve wraps of cannabis
  and 31 of cocaine.
