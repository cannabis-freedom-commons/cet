id: ua-mykolaiv-sentence-same-day
title: Nine years for 14 plants in Mykolaiv, beside an unrelated arrest
family: new-event
tests: [coverage, look-alike, classification, languages, corroboration]
submit: https://mk.npu.gov.ua/news/deviat-rokiv-uviaznennia-za-nezakonne-zberihannia-narkosyrovyny-zadlia-zbutu-u-mykolaievi-za-dokazamy-slidchykh-politsii-sud-vynis-vyrok-mistsevomu-meshkantsiu
setup:
  hide: [mykolaiv-nine-years-14-plants-8kg-cannabis]
why: >-
  A police statement in Ukrainian: a 51-year-old Mykolaiv man, searched in July, was sentenced to
  nine years for growing 14 cannabis plants and keeping dried cannabis for sale. The tracker has a
  report from the same city and the same day about a 44-year-old just arrested with almost 8 kg.
  Different man, different stage. The outlets disagree on the weight in this case (about 8 kg, or
  "over 10 kg" of raw material).
expect:
  outcome: {new_event: 1}
  country: {ua: 1}
  date: {value: 2026-11-02, tolerance_days: 2}
  type: {sentence: 1, prosecution: 0.5}
  place: {coordinates: [46.975, 31.995], within_km: 60}
  figures:
    prison: {match: ['9 years', 'nine years', '9-year', 'nine-year']}
    plants_destroyed: {value: 14}
  figures_optional: [kg_seized, arrested, charged, sentenced, convicted, plants_seized, sites]
  details:
    case_stage: [sentenced]
    sentence_types: [prison]
    activity: [cultivation]
  mentions:
    - {say: the nine-year sentence, any: ['nine years', '9 years', 'nine-year']}
    - {say: the 14 plants, any: ['14']}
    - {say: the search was in July, any: ['July']}
  must_not_say:
    - {say: he is the 44-year-old arrested that day, any: ['44-year-old', '44 years old']}
  sources:
    expect_independent: 2
    strict: true
    known: [mk.npu.gov.ua, npu.gov.ua, nikvesti.com, news.pn, nikpravda.com.ua, mayupravo.com, korabelov.info, novosti-n.org, 0512.com.ua, suspilne.media, inshe.tv]
    markers: ['51-річн', '51-летн', '14 рослин', '14 кущ', '14 растен', '14 куст', 'дев’ять років', "дев'ять років", 'девять лет', '9 років', '9 лет']
    markers_min: 2
