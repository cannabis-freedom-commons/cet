name: Deploy to GitHub Pages New

on:
  # every push to main: the backend's publication batches (backend/internal/worker/batch.go) and
  # people's commits; changes that cannot change the site wait for the next build
  push:
    branches: [main]
    paths-ignore: ['backend/**', 'deploy/**', 'compose.yaml', '.github/workflows/backend.yml']
  # Run workflow: build and deploy main now, also after a configuration change
  workflow_dispatch:

# Let the workflow publish to Pages using GitHub's own token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running one finishes, and of the pushes that come meanwhile only the
# newest waits, so a burst of pushes builds at most twice.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  # the tests (sources, citations, folders, country ids) run beside the build; a failure stops
  # deployment, as the deploy job needs both
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog tests read the commit history
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The changelog is generated from the full commit history.
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Astro 7.4 needs Node 22.23.4 or newer; "22" resolved to an older 22.x on GitHub
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      # Astro's content store and optimised images from the last build: only changed reports are
      # read again (a full sync takes some 45 s, a warm one about 10 s). Saved under the run, so
      # each build starts from the newest.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            astro-${{ hashFiles('package-lock.json') }}-
      # astro build directly: npm run build would run the tests again (prebuild), which the test
      # job does. The site URL and sub-path come from the repository's Pages settings, so the
      # same build works for user.github.io/repo and for tracker.cannabisfreedom.fyi.
      - run: npx astro build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # the submissions backend (docs/DEPLOY.md); unset leaves the submission form off
          PUBLIC_SUBMISSIONS_API_URL: ${{ vars.PUBLIC_SUBMISSIONS_API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [test, build]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages-new
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
